spring.application.name=sentiment
server.port=8080

# --- Charge le fichier .env (HF_TOKEN) s'il existe ---
spring.config.import=optional:file:.env[.properties]

# --- Base de données (dev : H2 fichier, persiste entre redémarrages) ---
spring.datasource.url=jdbc:h2:file:./data/reviews;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Upload CSV ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Hugging Face ---
huggingface.base-url=https://router.huggingface.co/hf-inference/models
huggingface.token=${HF_TOKEN:}
huggingface.model=cardiffnlp/twitter-xlm-roberta-base-sentiment
huggingface.summary-model=facebook/bart-large-cnn
huggingface.timeout=20s

# --- CORS (front Angular) ---
app.cors-origin=http://localhost:4200

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# --- Logs (jamais de token ni de texte d'avis en DEBUG) ---
logging.level.root=INFO
logging.level.com.shop.sentiment=INFO