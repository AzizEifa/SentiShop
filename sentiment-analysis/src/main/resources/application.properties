spring.application.name=sentiment
server.port=8080

# --- Charge le fichier .env (HF_TOKEN) s'il existe ---
spring.config.import=optional:file:.env[.properties]

# --- Base de données (dev : H2 fichier, persiste entre redémarrages) ---
spring.datasource.url=jdbc:h2:file:./data/reviews;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Upload CSV ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB

# --- Hugging Face ---
huggingface.base-url=https://router.huggingface.co/hf-inference/models
huggingface.token=${HF_TOKEN:}
huggingface.model=cardiffnlp/twitter-xlm-roberta-base-sentiment
huggingface.summary-model=facebook/bart-large-cnn
huggingface.timeout=20s

# --- CORS (front Angular) ---
app.cors-origin=http://localhost:4200

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# --- Logs (jamais de token ni de texte d'avis en DEBUG) ---
logging.level.root=INFO
logging.level.com.shop.sentiment=INFO
# --- Authentification (JWT) ---
# Secret de signature des jetons : au moins 32 caractères. À définir dans .env en dehors du développement.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-sentishop-2026-at-least-32-chars}
app.jwt.ttl=8h
# Compte administrateur créé au premier démarrage s'il n'existe aucun admin
app.admin.email=${ADMIN_EMAIL:admin@sentishop.local}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
app.admin.name=Administrateur
# Compte client de démonstration (désactivable : DEMO_CLIENT=false)
app.demo-client.enabled=${DEMO_CLIENT:true}
app.demo-client.email=client@sentishop.local
app.demo-client.password=Client123!
app.demo-client.name=Sara Benali

# --- Fichiers envoyés (images des produits, des avis, photos de profil) ---
app.uploads.dir=${UPLOADS_DIR:uploads}
app.uploads.max-image-size=3MB
